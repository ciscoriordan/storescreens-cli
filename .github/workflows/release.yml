name: Release

# Builds release binaries, creates a GitHub Release with the tarball attached,
# and bumps the Formula in ciscoriordan/homebrew-tap. Triggered by pushing a
# semver tag like `v1.4.1`.
#
# Prerequisites:
#   - Secret HOMEBREW_TAP_TOKEN: a fine-grained PAT with Contents: Write on
#     ciscoriordan/homebrew-tap (https://github.com/settings/personal-access-tokens).
#   - The tag being pushed must match the VERSION file at the repo root.

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16.3
        run: sudo xcode-select -s /Applications/Xcode_16.3.app
        continue-on-error: true

      - name: Print swift version
        run: swift --version

      - name: Derive version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          FILE_VERSION=$(cat VERSION)
          if [ "$VERSION" != "$FILE_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION file ($FILE_VERSION)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build release binaries
        run: swift build -c release

      - name: Stage and tarball
        id: tarball
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          STAGE="$RUNNER_TEMP/storescreens-v${VERSION}-macos"
          mkdir -p "$STAGE"
          cp .build/release/storescreens-cli "$STAGE/storescreens"
          cp .build/release/storescreens-mcp "$STAGE/storescreens-mcp"
          cp LICENSE "$STAGE/LICENSE"
          # SwiftPM emits the StorescreensCore resource bundle (laurel
          # SVGs etc.) next to the binaries. Bundle.module looks for it
          # at the same dir as the executable at runtime, so it must
          # ride along in the tarball or laurel rendering crashes with
          # "could not load resource bundle".
          BUNDLE=".build/release/storescreens-cli_StorescreensCore.bundle"
          if [ ! -d "$BUNDLE" ]; then
            echo "::error::Resource bundle missing at $BUNDLE"
            exit 1
          fi
          cp -R "$BUNDLE" "$STAGE/"
          chmod +x "$STAGE/storescreens" "$STAGE/storescreens-mcp"
          "$STAGE/storescreens" --version
          TARBALL="storescreens-v${VERSION}-macos.tar.gz"
          tar czf "$RUNNER_TEMP/$TARBALL" -C "$STAGE" .
          SHA256=$(shasum -a 256 "$RUNNER_TEMP/$TARBALL" | awk '{print $1}')
          echo "path=$RUNNER_TEMP/$TARBALL" >> "$GITHUB_OUTPUT"
          echo "name=$TARBALL" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "Built tarball: $TARBALL"
          echo "SHA256: $SHA256"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --generate-notes \
            "${{ steps.tarball.outputs.path }}"

      - name: Bump homebrew-tap formula
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA256: ${{ steps.tarball.outputs.sha256 }}
        run: |
          if [ -z "${TAP_TOKEN}" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN is not set; skipping tap bump. Formula must be updated manually."
            exit 0
          fi
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/ciscoriordan/homebrew-tap.git" "$RUNNER_TEMP/tap"
          cd "$RUNNER_TEMP/tap"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 - <<'PY'
          import os, re
          version = os.environ["VERSION"]
          sha256 = os.environ["SHA256"]
          p = "Formula/storescreens.rb"
          with open(p, "r") as f:
              content = f.read()
          content = re.sub(
              r'url "https://github\.com/ciscoriordan/storescreens-cli/releases/download/v[^/]+/storescreens-v[^"]+-macos\.tar\.gz"',
              f'url "https://github.com/ciscoriordan/storescreens-cli/releases/download/v{version}/storescreens-v{version}-macos.tar.gz"',
              content,
          )
          content = re.sub(r'sha256 "[a-f0-9]+"', f'sha256 "{sha256}"', content)
          content = re.sub(r'assert_match "\d+\.\d+\.\d+"', f'assert_match "{version}"', content)
          with open(p, "w") as f:
              f.write(content)
          PY
          git add Formula/storescreens.rb
          if git diff --cached --quiet; then
            echo "No formula changes to commit"
          else
            git commit -m "Bump storescreens to v${VERSION}"
            git push origin main
          fi

      # Keep storescreens-skill in lock-step with the CLI: every
      # CLI release tag gets mirrored onto the skill repo's current
      # main HEAD, so a user who pins either side by tag (`npx skills
      # add ciscoriordan/storescreens-skill@v2.0.1` or `brew install
      # ciscoriordan/tap/storescreens@2.0.1`) gets matching behavior.
      # Uses the same HOMEBREW_TAP_TOKEN since it already has write
      # scope on the same owner's repos; if the token is tap-only,
      # create a separate SKILL_REPO_TOKEN with Contents:Write on
      # ciscoriordan/storescreens-skill and swap it in below.
      # Non-fatal even when the whole step errors out: a missing or
      # too-narrowly-scoped token must not kill a CLI release. The
      # side-effect of syncing the skill tag is best-effort.
      - name: Tag matching version on storescreens-skill
        continue-on-error: true
        env:
          TAP_TOKEN: ${{ secrets.SKILL_REPO_TOKEN || secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set +e
          if [ -z "${TAP_TOKEN}" ]; then
            echo "::warning::No token available; skipping skill tag. Tag manually: git -C storescreens-skill tag v${VERSION} && git push origin v${VERSION}"
            exit 0
          fi
          if ! git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/ciscoriordan/storescreens-skill.git" "$RUNNER_TEMP/skill" 2>/dev/null; then
            echo "::warning::Clone of storescreens-skill failed (token likely lacks Contents:Write on that repo). Tag manually: git -C storescreens-skill tag v${VERSION} && git push origin v${VERSION}"
            exit 0
          fi
          cd "$RUNNER_TEMP/skill"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Sync the XCUITest starter template from the CLI's Resources
          # into the skill's assets/. SKILL.md step-7 tells agents to copy
          # `assets/ScreenshotTests.swift.template` into the user's project,
          # so the skill needs its own current copy after `npx skills add`.
          # The CLI repo is the canonical source (the template is coupled
          # to internal cache-path contracts), so we mirror on every release.
          TEMPLATE_SRC="$GITHUB_WORKSPACE/Sources/storescreens-cli/Resources/ScreenshotTests.swift.template"
          TEMPLATE_DST="assets/ScreenshotTests.swift.template"
          if [ -f "$TEMPLATE_SRC" ]; then
            mkdir -p assets
            cp "$TEMPLATE_SRC" "$TEMPLATE_DST"
            if ! git diff --quiet "$TEMPLATE_DST" 2>/dev/null; then
              git add "$TEMPLATE_DST"
              git commit -m "chore: sync ScreenshotTests.swift.template from storescreens-cli v${VERSION}"
              if ! git push origin main; then
                echo "::warning::Template sync commit failed to push; continuing to tag."
              else
                echo "synced ScreenshotTests.swift.template into storescreens-skill"
              fi
            fi
          else
            echo "::warning::Template source not found at $TEMPLATE_SRC; skipping sync."
          fi

          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "v${VERSION} already exists on storescreens-skill; skipping"
            exit 0
          fi
          git tag "v${VERSION}"
          if ! git push origin "v${VERSION}"; then
            echo "::warning::Push of v${VERSION} to storescreens-skill failed. Tag manually: git -C storescreens-skill tag v${VERSION} && git push origin v${VERSION}"
            exit 0
          fi
          echo "tagged storescreens-skill at v${VERSION}"

      # Trigger a rebuild of storescreens-web so its hero eyebrow picks
      # up the new release tag ("V X.Y.Z AVAILABLE NOW"). The web site's
      # Hero.astro frontmatter calls the GitHub releases API at build
      # time, so it only needs to be rebuilt, not given the version.
      # Token preference mirrors the skill step: a dedicated
      # WEB_REPO_TOKEN is preferred, with HOMEBREW_TAP_TOKEN as a
      # fallback if it happens to be broadly scoped. Non-fatal: a
      # missing or too-narrow token must not kill a CLI release.
      - name: Trigger storescreens-web rebuild
        continue-on-error: true
        env:
          WEB_TOKEN: ${{ secrets.WEB_REPO_TOKEN || secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set +e
          if [ -z "${WEB_TOKEN}" ]; then
            echo "::warning::No token available; skipping web dispatch. Rebuild manually: gh workflow run -R ciscoriordan/storescreens-web deploy.yml"
            exit 0
          fi
          status=$(curl -sS -o /tmp/dispatch.out -w "%{http_code}" \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${WEB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/ciscoriordan/storescreens-web/dispatches \
            -d "{\"event_type\":\"cli-release\",\"client_payload\":{\"version\":\"${VERSION}\"}}")
          if [ "$status" != "204" ]; then
            echo "::warning::Web dispatch returned HTTP $status (body follows). Rebuild manually: gh workflow run -R ciscoriordan/storescreens-web deploy.yml"
            cat /tmp/dispatch.out || true
            exit 0
          fi
          echo "Triggered storescreens-web rebuild for v${VERSION}"
