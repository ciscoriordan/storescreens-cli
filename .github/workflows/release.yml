name: Release

# Builds release binaries, creates a GitHub Release with the tarball attached,
# and bumps the Formula in ciscoriordan/homebrew-tap. Triggered by pushing a
# semver tag like `v1.4.1`.
#
# Prerequisites:
#   - Secret HOMEBREW_TAP_TOKEN: a fine-grained PAT with Contents: Write on
#     ciscoriordan/homebrew-tap (https://github.com/settings/personal-access-tokens).
#   - The tag being pushed must match the VERSION file at the repo root.

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16.3
        run: sudo xcode-select -s /Applications/Xcode_16.3.app
        continue-on-error: true

      - name: Print swift version
        run: swift --version

      - name: Derive version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          FILE_VERSION=$(cat VERSION)
          if [ "$VERSION" != "$FILE_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION file ($FILE_VERSION)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build release binaries
        run: swift build -c release

      - name: Stage and tarball
        id: tarball
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          STAGE="$RUNNER_TEMP/storescreens-v${VERSION}-macos"
          mkdir -p "$STAGE"
          cp .build/release/storescreens-cli "$STAGE/storescreens"
          cp .build/release/storescreens-mcp "$STAGE/storescreens-mcp"
          cp LICENSE "$STAGE/LICENSE"
          chmod +x "$STAGE/storescreens" "$STAGE/storescreens-mcp"
          "$STAGE/storescreens" --version
          TARBALL="storescreens-v${VERSION}-macos.tar.gz"
          tar czf "$RUNNER_TEMP/$TARBALL" -C "$STAGE" .
          SHA256=$(shasum -a 256 "$RUNNER_TEMP/$TARBALL" | awk '{print $1}')
          echo "path=$RUNNER_TEMP/$TARBALL" >> "$GITHUB_OUTPUT"
          echo "name=$TARBALL" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "Built tarball: $TARBALL"
          echo "SHA256: $SHA256"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --generate-notes \
            "${{ steps.tarball.outputs.path }}"

      - name: Bump homebrew-tap formula
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA256: ${{ steps.tarball.outputs.sha256 }}
        run: |
          if [ -z "${TAP_TOKEN}" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN is not set; skipping tap bump. Formula must be updated manually."
            exit 0
          fi
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/ciscoriordan/homebrew-tap.git" "$RUNNER_TEMP/tap"
          cd "$RUNNER_TEMP/tap"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 - <<'PY'
          import os, re
          version = os.environ["VERSION"]
          sha256 = os.environ["SHA256"]
          p = "Formula/storescreens.rb"
          with open(p, "r") as f:
              content = f.read()
          content = re.sub(
              r'url "https://github\.com/ciscoriordan/storescreens-cli/releases/download/v[^/]+/storescreens-v[^"]+-macos\.tar\.gz"',
              f'url "https://github.com/ciscoriordan/storescreens-cli/releases/download/v{version}/storescreens-v{version}-macos.tar.gz"',
              content,
          )
          content = re.sub(r'sha256 "[a-f0-9]+"', f'sha256 "{sha256}"', content)
          content = re.sub(r'assert_match "\d+\.\d+\.\d+"', f'assert_match "{version}"', content)
          with open(p, "w") as f:
              f.write(content)
          PY
          git add Formula/storescreens.rb
          if git diff --cached --quiet; then
            echo "No formula changes to commit"
          else
            git commit -m "Bump storescreens to v${VERSION}"
            git push origin main
          fi

      # Keep storescreens-skill in lock-step with the CLI: every
      # CLI release tag gets mirrored onto the skill repo's current
      # main HEAD, so a user who pins either side by tag (`npx skills
      # add ciscoriordan/storescreens-skill@v2.0.1` or `brew install
      # ciscoriordan/tap/storescreens@2.0.1`) gets matching behavior.
      # Uses the same HOMEBREW_TAP_TOKEN since it already has write
      # scope on the same owner's repos; if the token is tap-only,
      # create a separate SKILL_REPO_TOKEN with Contents:Write on
      # ciscoriordan/storescreens-skill and swap it in below.
      - name: Tag matching version on storescreens-skill
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ -z "${TAP_TOKEN}" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN is not set; skipping skill tag. Tag manually: git -C storescreens-skill tag v${VERSION} && git push origin v${VERSION}"
            exit 0
          fi
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/ciscoriordan/storescreens-skill.git" "$RUNNER_TEMP/skill"
          cd "$RUNNER_TEMP/skill"
          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "v${VERSION} already exists on storescreens-skill; skipping"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "v${VERSION}"
          git push origin "v${VERSION}"
